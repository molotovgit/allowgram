name: Allowgram bug report
description: Report an Allowgram problem using neutral reproduction data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload tokens, API credentials, phone numbers, login codes, tdata,
        build caches, full desktop captures or your personal allow-list.
        Use neutral examples and crop screenshots to the relevant app controls.
  - type: input
    id: version
    attributes:
      label: Allowgram version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Name the entry point and peer types without personal IDs or messages.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional cropped UI image or error text after reviewing it for private data.
