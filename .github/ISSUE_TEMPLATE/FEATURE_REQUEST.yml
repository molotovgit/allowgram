name: Allowgram feature request
description: Suggest a focused improvement within the client-side policy scope.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and intended behavior
      description: Explain the use case with neutral examples and no private account data.
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Effect on the allow-list
      description: Explain which destinations or bot permissions the feature would require.
    validations:
      required: true
